name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r python_d3/requirements.txt
      - run: python scripts/build_data.py --check
      - run: python -m python_d3.export --check
      - run: python scripts/validate_data.py
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: npm test
